<style>

    --bg: #eef5ea;            /* 页面浅绿底 */
    --paper: #f7fbf4;
    --primary: #5c9a67;       /* 主绿 */
    --primary-deep: #41724d;  /* 深绿 */
    --primary-soft: #a9cfa9;  /* 浅绿 */
    --primary-pale: #dfecdb;  /* 极浅绿 */
    --bubble-me: #6cae75;     /* 我的气泡 */
    --bubble-you: #ffffff;    /* 对方气泡 */
    --ink: #2f4536;           /* 正文 */
    --ink-soft: #7d947f;      /* 次要文字 */
    --line: #d3e4cf;
    --tape: rgba(92, 154, 103, .28);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background:
      repeating-linear-gradient(0deg, rgba(47,69,54,.025) 0 1px, transparent 1px 28px),
      linear-gradient(180deg, #e7f1e2, var(--bg));
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  /* ===== 顶部标题条 ===== */
  header {
    position: relative;
    text-align: center;
    padding: 22px 16px 16px;
    background: linear-gradient(160deg, var(--primary-deep), var(--primary));
    color: #fff;
    box-shadow: 0 3px 14px rgba(65,114,77,.28);
    flex: none;
    z-index: 2;
  }
  header .tape {
    position: absolute;
    height: 22px;
    width: 110px;
    background: var(--tape);
    opacity: .6;
    box-shadow: 0 1px 2px rgba(47,69,54,.2);
  }
  header .tape.t1 { top: 14px; left: -26px; transform: rotate(-38deg); }
  header .tape.t2 { top: 18px; right: -26px; transform: rotate(38deg); }
  header h1 {
    font-family: "Ma Shan Zheng", "Kaiti SC", "STKaiti", "KaiTi", cursive;
    font-size: 34px;
    font-weight: 400;
    letter-spacing: 4px;
    text-shadow: 0 1px 3px rgba(0,0,0,.18);
  }
  header .sub {
    margin-top: 6px;
    font-size: 13px;
    letter-spacing: 2px;
    opacity: .92;
  }

  /* ===== 聊天区 ===== */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 14px 12px;
    scroll-behavior: smooth;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg { display: flex; }
  .msg.me { justify-content: flex-end; }
  .msg.you { justify-content: flex-start; }

  .bubble {
    max-width: 78%;
    padding: 11px 15px;
    border-radius: 16px;
    line-height: 1.6;
    font-size: 16px;
    word-break: break-word;
    white-space: pre-wrap;
    box-shadow: 0 2px 6px rgba(47,69,54,.10);
    animation: pop .28s ease;
  }
  .msg.me .bubble {
    background: linear-gradient(160deg, #63a66d, var(--bubble-me));
    color: #fff;
    border-bottom-right-radius: 5px;
  }
  .msg.you .bubble {
    background: var(--bubble-you);
    color: var(--ink);
    border: 1px solid var(--line);
    border-bottom-left-radius: 5px;
  }
  /* 颜文字单独一张时，气泡更紧凑、居中一点 */
  .msg.you .bubble.kaomoji { font-size: 18px; letter-spacing: 1px; }

  @keyframes pop {
    from { opacity: 0; transform: translateY(8px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* 对方“正在输入” */
  .typing { display: inline-flex; gap: 4px; padding: 6px 4px; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ink-soft);
    animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

  /* ===== 底部输入 ===== */
  footer {
    flex: none;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(247,251,244,.92);
    backdrop-filter: blur(6px);
    border-top: 1px solid var(--line);
  }
  .inputbar {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .inputbar input {
    flex: 1;
    border: 1.5px solid var(--line);
    border-radius: 22px;
    padding: 11px 16px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
    outline: none;
    transition: border-color .15s;
  }
  .inputbar input:focus { border-color: var(--primary-soft); }
  .inputbar button {
    flex: none;
    width: 46px; height: 46px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(160deg, #63a66d, var(--primary));
    color: #fff;
    font-size: 19px;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(65,114,77,.3);
    transition: transform .12s ease, filter .12s ease;
  }
  .inputbar button:active { transform: scale(.92); }
  .inputbar button:disabled { filter: grayscale(.3); opacity: .7; cursor: default; }

  @media (max-width: 480px) {
    header h1 { font-size: 30px; }
    .bubble { max-width: 85%; font-size: 15px; }
  }
</style>

// 合并所有分类成一个大数组，用于全局随机抽卡
const ALL_CARDS = Object.values(CARDS).flat();

// 判断是不是「纯颜文字」（不含汉字，用来给气泡加个紧凑样式）
function isKaomoji(s) {
  return !/[一-鿿]/.test(s);
}

// 洗牌：返回打乱后的新数组（不修改原数组）
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 随机抽 n 张不重复的字卡
function pick(n) {
  return shuffle(ALL_CARDS).slice(0, n);
}

// 每次回复随机抽 1~3 句
function randomCount() {
  return 1 + Math.floor(Math.random() * 3);
}

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

function scrollBottom() {
  const main = document.querySelector("main");
  main.scrollTop = main.scrollHeight;
}

// 添加一条消息
function addMessage(side, text, opts = {}) {
  const row = document.createElement("div");
  row.className = "msg " + side;

  const bubble = document.createElement("div");
  bubble.className = "bubble" + (opts.kaomoji ? " kaomoji" : "");
  bubble.textContent = text;

  row.appendChild(bubble);
  chat.appendChild(row);
  scrollBottom();
  return row;
}

// 显示“正在输入”气泡，返回它的容器，方便之后移除
function showTyping() {
  const row = document.createElement("div");
  row.className = "msg you";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  row.appendChild(bubble);
  chat.appendChild(row);
  scrollBottom();
  return row;
}

// 发送主流程
function send() {
  const text = input.value.trim();
  if (!text) return;

  // 1. 显示我发的消息
  addMessage("me", text);
  input.value = "";

  // 2. 短暂“正在输入”，再随机回复
  sendBtn.disabled = true;
  const typingRow = showTyping();

  const delay = 500 + Math.random() * 700; // 500~1200ms
  setTimeout(() => {
    typingRow.remove();

    const n = randomCount();
    const cards = pick(n);
    cards.forEach((c) => addMessage("you", c, { kaomoji: isKaomoji(c) }));

    sendBtn.disabled = false;
    input.focus();
  }, delay);
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    send();
  }
});

// 开场：进入页面后，随机抽一句作为第一句
setTimeout(() => {
  const first = pick(1)[0];
  addMessage("you", first, { kaomoji: isKaomoji(first) });
}, 400);
</script>
